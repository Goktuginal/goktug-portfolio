<header [class.scrolled]="isScrolled" [class.transparent]="isHomePage">
  <div class="container">
    <div class="logo">
      <h1>Designed by Angular Framework</h1>
    </div>
    
    <button class="mobile-toggle" (click)="toggleMenu()">
      <i class="fas" [class.fa-bars]="!menuOpen" [class.fa-times]="menuOpen"></i>
    </button>
    
    <nav [class.show]="menuOpen">
      <ul>
        <li><a href="#home" [class.active]="activeSection === 'home'" (click)="closeMenu()">Home</a></li>
        <li><a href="#about" [class.active]="activeSection === 'about'" (click)="closeMenu()">About</a></li>
        <li><a href="#skills" [class.active]="activeSection === 'skills'" (click)="closeMenu()">Skills</a></li>
        <li><a href="#experience" [class.active]="activeSection === 'experience'" (click)="closeMenu()">Experience</a></li>
        <li><a href="#projects" [class.active]="activeSection === 'projects'" (click)="closeMenu()">Projects</a></li>
        <li><a href="#contact" class="contact-button" (click)="closeMenu()">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
